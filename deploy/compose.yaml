# Keepalive self-host stack: keepalive-server + coturn + Caddy (automatic TLS).
# Run from this directory:  cp .env.example .env && docker compose up -d
name: keepalive

services:
  server:
    image: ${KEEPALIVE_IMAGE:-ghcr.io/parkertonra/keepalive-server:latest}
    # To build from source instead of pulling the image, uncomment:
    # build: ../server
    restart: unless-stopped
    command:
      - --listen
      - :8080
      - --public-url
      - wss://${LOBBY_DOMAIN:?set LOBBY_DOMAIN in .env}
      - --turn-urls
      - turn:${LOBBY_DOMAIN}:3478,turn:${LOBBY_DOMAIN}:3478?transport=tcp,turns:${LOBBY_DOMAIN}:${TURN_TLS_PORT:-5349}?transport=tcp
      - --turn-secret
      - ${TURN_SECRET:?set TURN_SECRET in .env}
      - --allowed-games
      - ${ALLOWED_GAMES:-*}
      - --max-lobbies
      - ${MAX_LOBBIES:-1000}
    expose:
      - "8080"
    networks: [web]
    read_only: true
    security_opt: ["no-new-privileges:true"]

  # coturn uses host networking: a relay range of 240 UDP ports is slow and fragile through
  # Docker's port publishing, and the relay must see real client addresses.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    user: "0:0"   # Caddy writes the private key as root, mode 0600
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --realm=${LOBBY_DOMAIN}
      - --external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in .env}
      - --tls-listening-port=${TURN_TLS_PORT:-5349}
      - --cert=/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${LOBBY_DOMAIN}/${LOBBY_DOMAIN}.crt
      - --pkey=/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${LOBBY_DOMAIN}/${LOBBY_DOMAIN}.key
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      # Reuse the certificate Caddy obtains. coturn only starts TLS listeners once it exists.
      - caddy_data:/caddy-data:ro
    depends_on: [caddy]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LOBBY_DOMAIN: ${LOBBY_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
      GAME_DOMAIN: ${GAME_DOMAIN:-http://localhost:8081}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./game-web:/srv/game:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
