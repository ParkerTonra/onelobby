# coturn config for OneLobby. Secrets, realm, external-ip, TLS port and certificates are
# passed on the command line by compose.yaml (or systemd), so nothing secret lives here.

# --- Ports ---
listening-port=3478
# tls-listening-port comes from the command line (default 5349)
min-port=49160
max-port=49400
fingerprint

# --- Auth: REST credentials (username = expiry:peerId, password = base64 HMAC-SHA1) ---
use-auth-secret
# static-auth-secret=...        (command line)
no-multicast-peers
stale-nonce=600

# --- Quotas: protect your bandwidth ---
total-quota=200
user-quota=6
max-bps=1000000
bps-capacity=0

# --- No relaying into your own network ---
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- Hardening ---
no-cli
no-tlsv1
no-tlsv1_1
no-software-attribute
log-file=stdout
simple-log
