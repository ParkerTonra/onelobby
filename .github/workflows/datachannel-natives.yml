# Builds the libdatachannel natives for OneLobby.DataChannel (versions pinned in
# clients/dotnet/OneLobby.DataChannel/native/versions.env) and runs the live two-peer WebRTC test where it can.
# Built natives are cached on a hash of native/ (pins + build scripts), so the C/C++ build only reruns when those change.
name: datachannel-natives

on:
  workflow_dispatch:
  push:
    paths:
      - "clients/dotnet/OneLobby.DataChannel/**"
      - ".github/workflows/datachannel-natives.yml"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      # a credential or terminal prompt fails fast instead of hanging the job
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - id: cache
        uses: actions/cache@v4
        with:
          path: clients/dotnet/OneLobby.DataChannel/runtimes/win-x64/native/
          key: natives-win-x64-${{ hashFiles('clients/dotnet/OneLobby.DataChannel/native/**') }}
      - name: Build datachannel.dll (MSVC, CMake, Ninja from the VS install)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: clients/dotnet/OneLobby.DataChannel/native/build-windows.ps1 -WorkDir "$env:RUNNER_TEMP/ldc"
      - name: Live WebRTC test (two peers through an in-process OneLobby.Server)
        run: dotnet test clients/dotnet/OneLobby.DataChannel.Tests
      - uses: actions/upload-artifact@v4
        with: { name: native-win-x64, path: clients/dotnet/OneLobby.DataChannel/runtimes/win-x64/native/ }

  linux-x64:
    runs-on: ubuntu-22.04   # glibc 2.35, same as the Docker build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - id: cache
        uses: actions/cache@v4
        with:
          path: clients/dotnet/OneLobby.DataChannel/runtimes/linux-x64/native/
          key: natives-linux-x64-${{ hashFiles('clients/dotnet/OneLobby.DataChannel/native/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Build libdatachannel.so
        if: steps.cache.outputs.cache-hit != 'true'
        run: TARGET=linux-x64 bash clients/dotnet/OneLobby.DataChannel/native/build-posix.sh
      - name: Live WebRTC test
        run: dotnet test clients/dotnet/OneLobby.DataChannel.Tests
      - uses: actions/upload-artifact@v4
        with: { name: native-linux-x64, path: clients/dotnet/OneLobby.DataChannel/runtimes/linux-x64/native/ }

  macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - id: cache
        uses: actions/cache@v4
        with:
          path: clients/dotnet/OneLobby.DataChannel/runtimes/osx/native/
          key: natives-osx-${{ hashFiles('clients/dotnet/OneLobby.DataChannel/native/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: brew install ninja
      - name: Build libdatachannel.dylib (arm64 + x86_64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: TARGET=osx bash clients/dotnet/OneLobby.DataChannel/native/build-posix.sh
      - run: lipo -info clients/dotnet/OneLobby.DataChannel/runtimes/osx/native/libdatachannel.dylib
      - name: Live WebRTC test
        run: dotnet test clients/dotnet/OneLobby.DataChannel.Tests
      - uses: actions/upload-artifact@v4
        with: { name: native-osx, path: clients/dotnet/OneLobby.DataChannel/runtimes/osx/native/ }

  android-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: clients/dotnet/OneLobby.DataChannel/runtimes/android-arm64/native/
          key: natives-android-arm64-${{ hashFiles('clients/dotnet/OneLobby.DataChannel/native/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Build libdatachannel.so (NDK, API 24, arm64-v8a, 16 KB pages)
        if: steps.cache.outputs.cache-hit != 'true'
        run: TARGET=android-arm64 ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash clients/dotnet/OneLobby.DataChannel/native/build-posix.sh
      - uses: actions/upload-artifact@v4
        with: { name: native-android-arm64, path: clients/dotnet/OneLobby.DataChannel/runtimes/android-arm64/native/ }
