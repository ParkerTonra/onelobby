# Runs the JS client tests on Linux the way the publish job does (without publishing anything), plus the managed
# .NET unit tests.
name: Tests

on:
  pull_request:
  push:
    branches: [main, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: clients/js
        run: npm ci
      - name: Typecheck, build, test (prepublishOnly)
        working-directory: clients/js/packages/client
        run: npm run prepublishOnly
      - name: Loopback run holds no socket off 127.0.0.1 (Direct host + joiner, plain node-datachannel)
        run: |
          bash tools/loopback-check/selftest.sh
          bash tools/loopback-check/loopback-sockets.sh js-direct -- bash tools/loopback-check/direct-pair.sh js
      - name: Test create-onelobby (scaffolder, update, verify, recommend)
        working-directory: clients/js/packages/create-onelobby
        run: npm test

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Core tests
        run: dotnet test clients/dotnet/OneLobby.Core.Tests
      - name: Replication tests
        run: dotnet test clients/dotnet/OneLobby.Replication.Tests

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # the dual-stack port-hijack tests open sockets on every interface; locally they are skipped (Windows firewall prompt)
      ONELOBBY_TEST_ANY_INTERFACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Server tests
        run: dotnet test server/OneLobby.Server.sln
